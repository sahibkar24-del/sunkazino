<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sun Kazino & Kazanç</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0d0a1a;
      --card-bg: #17132b;
      --accent-gold: #ffd700;
      --accent-orange: #ff8c00;
      --text-color: #ffffff;
      --danger: #ff4757;
      --success: #2ed573;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; user-select: none; }
    body { background: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; text-align: center; }

    /* Header & Balance */
    header { width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .logo { font-size: 22px; font-weight: bold; color: var(--accent-gold); text-shadow: 0 0 10px rgba(255,215,0,0.4); }
    .balance-box { background: var(--card-bg); border: 1px solid var(--accent-gold); border-radius: 20px; padding: 6px 16px; font-size: 16px; font-weight: bold; }
    .balance-box span { color: var(--accent-gold); font-size: 18px; }

    /* Navigation Tabs */
    .tabs { display: flex; gap: 8px; width: 100%; max-width: 420px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 10px 4px; background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); color: #aaa; border-radius: 12px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: linear-gradient(135deg, var(--accent-gold), var(--accent-orange)); color: #000; border-color: var(--accent-gold); }

    /* Main Container */
    .view { display: none; width: 100%; max-width: 420px; background: var(--card-bg); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,215,0,0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .view.active { display: flex; flex-direction: column; align-items: center; }

    /* Bet Control */
    .bet-control { margin-bottom: 15px; width: 100%; }
    .bet-title { font-size: 13px; color: #888; margin-bottom: 6px; }
    .bet-btns { display: flex; gap: 6px; justify-content: center; }
    .bet-btn { flex: 1; padding: 6px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .bet-btn.active { border-color: var(--accent-gold); color: var(--accent-gold); background: rgba(255,215,0,0.1); }

    /* Slots Game */
    .slots-container { display: flex; gap: 10px; margin: 20px 0; }
    .slot { width: 80px; height: 100px; background: #0a0814; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 40px; border: 2px solid var(--accent-gold); }

    /* Mines Game */
    .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; margin: 15px 0; }
    .mine-card { aspect-ratio: 1; background: #0a0814; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: 0.2s; }
    .mine-card.revealed { background: #252042; }

    /* Scratch Game */
    .scratch-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 240px; margin: 15px 0; }
    .scratch-card { width: 70px; height: 70px; background: linear-gradient(135deg, #444, #222); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; border: 1px solid var(--accent-gold); }
    .scratch-card.revealed { background: #0a0814; }

    /* Buttons & Status */
    .action-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent-gold), var(--accent-orange)); color: #000; border: none; font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(255,140,0,0.3); transition: 0.1s; margin-top: 10px; }
    .action-btn:active { transform: scale(0.98); }
    .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .status-msg { margin-top: 12px; font-size: 15px; min-height: 20px; font-weight: 500; }

    /* Deposit Section */
    .dep-title { font-size: 18px; color: var(--accent-gold); margin-bottom: 15px; }
    .dep-options { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
    .dep-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .dep-card.selected { border-color: var(--accent-gold); background: rgba(255,215,0,0.05); }
    .dep-card img { height: 25px; }
    .input-group { width: 100%; text-align: left; margin-bottom: 15px; }
    .input-group label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; }
    .input-group input { width: 100%; padding: 12px; background: #0a0814; border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; color: #fff; font-size: 16px; }
  </style>
</head>
<body>

  <header>
    <div class="logo">☀️ SUN KAZİNO</div>
    <div class="balance-box">Balans: <span id="balance">0.00</span> AZN</div>
  </header>

  <!-- Navigation -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('slots')">🎰 Slot</button>
    <button class="tab-btn" onclick="switchTab('mines')">💣 Mina</button>
    <button class="tab-btn" onclick="switchTab('scratch')">🎟️ Poz Qazan</button>
    <button class="tab-btn" onclick="switchTab('deposit')">💳 Depozit</button>
  </div>

  <!-- Common Bet Controls -->
  <div class="bet-control" id="betControlSection">
    <div class="bet-title">MƏRC MƏBLƏĞİ (AZN)</div>
    <div class="bet-btns">
      <button class="bet-btn active" onclick="setBet(1, this)">1</button>
      <button class="bet-btn" onclick="setBet(5, this)">5</button>
      <button class="bet-btn" onclick="setBet(10, this)">10</button>
      <button class="bet-btn" onclick="setBet(20, this)">20</button>
      <button class="bet-btn" onclick="setBet(50, this)">50</button>
    </div>
  </div>

  <!-- SLOT GAME -->
  <div class="view active" id="slotsView">
    <div class="slots-container">
      <div class="slot" id="slot1">☀️</div>
      <div class="slot" id="slot2">☀️</div>
      <div class="slot" id="slot3">☀️</div>
    </div>
    <button class="action-btn" id="spinBtn" onclick="playSlots()">OYNAT</button>
    <div class="status-msg" id="slotsStatus"></div>
  </div>

  <!-- MINES GAME -->
  <div class="view" id="minesView">
    <div class="mines-grid" id="minesGrid"></div>
    <button class="action-btn" id="minesBtn" onclick="startMines()">BAŞLA</button>
    <div class="status-msg" id="minesStatus"></div>
  </div>

  <!-- SCRATCH GAME -->
  <div class="view" id="scratchView">
    <div class="scratch-grid" id="scratchGrid"></div>
    <button class="action-btn" id="scratchBtn" onclick="startScratch()">YENİ KART AL</button>
    <div class="status-msg" id="scratchStatus"></div>
  </div>

  <!-- DEPOSIT VIEW -->
  <div class="view" id="depositView">
    <div class="dep-title">Balans Yükləmə</div>
    <div class="dep-options">
      <div class="dep-card selected" onclick="selectPayMethod('birbank', this)">
        <span>Birbank (BirKart)</span>
        <span style="color:var(--accent-gold); font-weight:bold;">0% komissiya</span>
      </div>
      <div class="dep-card" onclick="selectPayMethod('card', this)">
        <span>İstənilən Bank Kartı (VISA/MC)</span>
        <span style="color:var(--accent-gold); font-weight:bold;">0% komissiya</span>
      </div>
    </div>
    <div class="input-group">
      <label>Məbləğ (Minimum 5 AZN)</label>
      <input type="number" id="depAmount" value="5" min="5" placeholder="Məbləğ daxil edin">
    </div>
    <button class="action-btn" onclick="processDeposit()">ÖDƏNİŞƏ KEÇ (PULSUZ)</button>
    <div class="status-msg" id="depStatus"></div>
  </div>

  <script>
    // Sound Synthesizer (Web Audio API)
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioCtx();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'click') {
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } else if (type === 'win') {
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'lose') {
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    // State Variables
    let balance = parseFloat(localStorage.getItem('sun_bal')) || 20.00;
    let currentBet = 1;
    let activeTab = 'slots';

    function updateBalanceUI() {
      document.getElementById('balance').innerText = balance.toFixed(2);
      localStorage.setItem('sun_bal', balance);
    }
    updateBalanceUI();

    function setBet(amount, btn) {
      playSound('click');
      currentBet = amount;
      document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function switchTab(tab) {
      playSound('click');
      activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(tab + 'View').classList.add('active');

      document.getElementById('betControlSection').style.display = (tab === 'deposit') ? 'none' : 'block';
    }

    // --- SLOTS OYUNU ---
    const slotItems = ['☀️', '💎', '7️⃣', '🍒', '🪙', '⭐'];
    function playSlots() {
      if (balance < currentBet) {
        document.getElementById('slotsStatus').innerText = 'Kifayət qədər balans yoxdur! Depozit edin.';
        return;
      }

      balance -= currentBet;
      updateBalanceUI();
      playSound('click');

      const spinBtn = document.getElementById('spinBtn');
      spinBtn.disabled = true;
      document.getElementById('slotsStatus').innerText = 'Fırlanır...';

      let count = 0;
      const timer = setInterval(() => {
        const r1 = slotItems[Math.floor(Math.random() * slotItems.length)];
        const r2 = slotItems[Math.floor(Math.random() * slotItems.length)];
        const r3 = slotItems[Math.floor(Math.random() * slotItems.length)];

        document.getElementById('slot1').innerText = r1;
        document.getElementById('slot2').innerText = r2;
        document.getElementById('slot3').innerText = r3;

        count++;
        if (count > 12) {
          clearInterval(timer);
          spinBtn.disabled = false;
          
          if (r1 === r2 && r2 === r3) {
            const win = currentBet * 10;
            balance += win;
            playSound('win');
            document.getElementById('slotsStatus').innerText = `CEKPOT! +${win.toFixed(2)} AZN! 🎉`;
          } else if (r1 === r2 || r2 === r3 || r1 === r3) {
            const win = currentBet * 2;
            balance += win;
            playSound('win');
            document.getElementById('slotsStatus').innerText = `Təbriklər! +${win.toFixed(2)} AZN! ✨`;
          } else {
            playSound('lose');
            document.getElementById('slotsStatus').innerText = 'Şansınızı bir daha sınayın!';
          }
          updateBalanceUI();
        }
      }, 80);
    }

    // --- MINES OYUNU ---
    let minesState = { active: false, bombs: [], openedCount: 0, multiplier: 1.0 };
    
    function initMinesGrid() {
      const grid = document.getElementById('minesGrid');
      grid.innerHTML = '';
      for (let i = 0; i < 25; i++) {
        const card = document.createElement('div');
        card.className = 'mine-card';
        card.onclick = () => revealMine(i, card);
        grid.appendChild(card);
      }
    }
    initMinesGrid();

    function startMines() {
      const btn = document.getElementById('minesBtn');
      if (minesState.active) {
        // Cashout
        const win = currentBet * minesState.multiplier;
        balance += win;
        updateBalanceUI();
        playSound('win');
        document.getElementById('minesStatus').innerText = `Uğurla nağdlaşdırıldı: +${win.toFixed(2)} AZN`;
        endMines();
        return;
      }

      if (balance < currentBet) {
        document.getElementById('minesStatus').innerText = 'Balansınız çatmır!';
        return;
      }

      balance -= currentBet;
      updateBalanceUI();
      playSound('click');

      minesState = { active: true, bombs: [], openedCount: 0, multiplier: 1.0 };
      
      // Random 3 bombs
      while(minesState.bombs.length < 3) {
        let r = Math.floor(Math.random() * 25);
        if(!minesState.bombs.includes(r)) minesState.bombs.push(r);
      }

      initMinesGrid();
      btn.innerText = 'NAĞDLAŞDIR (0.00 AZN)';
      document.getElementById('minesStatus').innerText = 'Təmiz xanaları tapın!';
    }

    function revealMine(index, card) {
      if(!minesState.active || card.classList.contains('revealed')) return;

      card.classList.add('revealed');
      if (minesState.bombs.includes(index)) {
        card.innerText = '💣';
        playSound('lose');
        document.getElementById('minesStatus').innerText = 'Mina partladı! Uduzdunuz.';
        endMines();
      } else {
        card.innerText = '💎';
        playSound('click');
        minesState.openedCount++;
        minesState.multiplier += 0.35;
        const currentWin = currentBet * minesState.multiplier;
        document.getElementById('minesBtn').innerText = `NAĞDLAŞDIR (${currentWin.toFixed(2)} AZN)`;
      }
    }

    function endMines() {
      minesState.active = false;
      document.getElementById('minesBtn').innerText = 'YENİDƏN BAŞLA';
    }

    // --- SCRATCH (POZ QAZAN) OYUNU ---
    let scratchItems = [];
    let revealedScratch = 0;

    function startScratch() {
      if (balance < currentBet) {
        document.getElementById('scratchStatus').innerText = 'Balansınız çatmır!';
        return;
      }

      balance -= currentBet;
      updateBalanceUI();
      playSound('click');

      const symbols = ['☀️', '💎', '🍒', '🪙', '⭐'];
      scratchItems = [];
      revealedScratch = 0;

      // Fill grid symbols
      for(let i=0; i<9; i++) {
        scratchItems.push(symbols[Math.floor(Math.random() * symbols.length)]);
      }

      const grid = document.getElementById('scratchGrid');
      grid.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const card = document.createElement('div');
        card.className = 'scratch-card';
        card.innerText = '❓';
        card.onclick = () => scratchCard(i, card);
        grid.appendChild(card);
      }

      document.getElementById('scratchStatus').innerText = 'Xanaları pozun (3 eyni simvol = uduş)';
    }
    startScratch();

    function scratchCard(index, card) {
      if (card.classList.contains('revealed')) return;

      card.classList.add('revealed');
      card.innerText = scratchItems[index];
      playSound('click');
      revealedScratch++;

      if (revealedScratch === 9) {
        // Check win conditions (3 of a kind)
        const counts = {};
        scratchItems.forEach(item => counts[item] = (counts[item] || 0) + 1);
        let won = false;

        for (let item in counts) {
          if (counts[item] >= 3) {
            won = true;
            break;
          }
        }

        if (won) {
          const win = currentBet * 3;
          balance += win;
          playSound('win');
          document.getElementById('scratchStatus').innerText = `3 EY Nİ SİMVOL! +${win.toFixed(2)} AZN! 🎉`;
        } else {
          playSound('lose');
          document.getElementById('scratchStatus').innerText = 'Uduş olmadı, bir daha sınayın.';
        }
        updateBalanceUI();
      }
    }

    // --- DEPOZİT SİSTEMİ ---
    let selectedMethod = 'birbank';

    function selectPayMethod(method, elem) {
      playSound('click');
      selectedMethod = method;
      document.querySelectorAll('.dep-card').forEach(c => c.classList.remove('selected'));
      elem.classList.add('selected');
    }

    function processDeposit() {
      const amount = parseFloat(document.getElementById('depAmount').value);
      if (isNaN(amount) || amount < 5) {
        document.getElementById('depStatus').innerText = 'Minimum yükləmə məbləği 5 AZN-dir!';
        return;
      }

      playSound('click');
      document.getElementById('depStatus').innerText = 'Ödəniş keçidi hazırlanır...';

      setTimeout(() => {
        // Demo üçün balansı artırır və Telegram WebApp pəncərəsini xəbərdar edir
        balance += amount;
        updateBalanceUI();
        playSound('win');
        document.getElementById('depStatus').innerText = `Uğurlu ödəniş! +${amount.toFixed(2)} AZN balansa əlavə edildi.`;
      }, 1500);
    }
  </script>
</body>
</html>
