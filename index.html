<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sun Kazino</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background: #0f0c20; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; text-align: center; }
    h1 { color: #ffd700; margin-bottom: 10px; font-size: 28px; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
    .balance-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 215, 0, 0.3); border-radius: 12px; padding: 12px 24px; margin-bottom: 30px; font-size: 18px; }
    .balance-card span { color: #ffd700; font-weight: bold; font-size: 22px; }
    .slots-container { display: flex; gap: 15px; background: #1a1636; padding: 20px; border-radius: 20px; border: 2px solid #ffd700; box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); margin-bottom: 30px; }
    .slot { width: 80px; height: 100px; background: #0b0919; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 45px; border: 1px solid #332d59; }
    .spin-btn { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #000; border: none; padding: 16px 45px; font-size: 20px; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(255, 140, 0, 0.4); transition: transform 0.1s, opacity 0.2s; }
    .spin-btn:active { transform: scale(0.96); }
    .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-msg { margin-top: 20px; font-size: 18px; min-height: 24px; font-weight: 500; }
    .win { color: #4caf50; }
    .lose { color: #ff5252; }
  </style>
</head>
<body>

  <h1>☀️ Sun Kazino</h1>
  
  <div class="balance-card">
    Balans: <span id="balance">1000</span> 🪙
  </div>

  <div class="slots-container">
    <div class="slot" id="slot1">☀️</div>
    <div class="slot" id="slot2">☀️</div>
    <div class="slot" id="slot3">☀️</div>
  </div>

  <button class="spin-btn" id="spinBtn" onclick="spin()">OYNAT (10 🪙)</button>
  
  <div class="status-msg" id="status">Uğurlar diləyirik!</div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let balance = 1000;
    const items = ['☀️', '💎', '7️⃣', '🍒', '🪙', '⭐'];
    
    function spin() {
      if (balance < 10) {
        document.getElementById('status').innerText = 'Kifayət qədər balans yoxdur!';
        document.getElementById('status').className = 'status-msg lose';
        return;
      }

      balance -= 10;
      document.getElementById('balance').innerText = balance;
      
      const spinBtn = document.getElementById('spinBtn');
      const status = document.getElementById('status');
      spinBtn.disabled = true;
      status.innerText = 'Fırlanır...';
      status.className = 'status-msg';

      let spins = 0;
      const maxSpins = 15;
      const interval = setInterval(() => {
        const r1 = items[Math.floor(Math.random() * items.length)];
        const r2 = items[Math.floor(Math.random() * items.length)];
        const r3 = items[Math.floor(Math.random() * items.length)];
        
        document.getElementById('slot1').innerText = r1;
        document.getElementById('slot2').innerText = r2;
        document.getElementById('slot3').innerText = r3;

        spins++;
        if (spins >= maxSpins) {
          clearInterval(interval);
          spinBtn.disabled = false;
          checkWin(r1, r2, r3);
        }
      }, 100);
    }

    function checkWin(s1, s2, s3) {
      const status = document.getElementById('status');
      if (s1 === s2 && s2 === s3) {
        const winAmount = 100;
        balance += winAmount;
        document.getElementById('balance').innerText = balance;
        status.innerText = `Cekpot! +${winAmount} 🪙 qazandınız! 🎉`;
        status.className = 'status-msg win';
      } else if (s1 === s2 || s2 === s3 || s1 === s3) {
        const winAmount = 20;
        balance += winAmount;
        document.getElementById('balance').innerText = balance;
        status.innerText = `Təbriklər! +${winAmount} 🪙 qazandınız! ✨`;
        status.className = 'status-msg win';
      } else {
        status.innerText = 'Uduzduq, bir daha yoxlayın!';
        status.className = 'status-msg lose';
      }
    }
  </script>
</body>
</html>
