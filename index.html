  <script>
    const tg = window.Telegram?.WebApp;
    if(tg) {
      tg.expand();
      tg.ready();
    }

    const BOT_TOKEN = "8836417399:AAGzWfJyIHiQMNuO1VhGrYU65wjf7eUqLsk";
    const ADMIN_CHAT_ID = "7723256649"; // Adminin Telegram ID-si

    // Firebase Qoşulması
    const firebaseConfig = {
      databaseURL: "https://sunkazino-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Telegram istifadəçi ID-sini təhlükəsiz almaq
    const user = tg?.initDataUnsafe?.user;
    const userId = user?.id ? String(user.id) : null;

    let balance = 0.00;

    // Firebase Canlı Balans Dinləyicisi
    if (userId) {
      db.ref(`users/${userId}/balance`).on('value', (snapshot) => {
        const val = snapshot.val();
        if (val !== null && val !== undefined) {
          balance = parseFloat(val);
          updateBalanceUI();
        }
      });
    }

    function saveBalanceToDB(newBal) {
      if (userId) {
        db.ref(`users/${userId}/balance`).set(newBal);
      }
    }

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioCtx();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'click') {
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } else if (type === 'win') {
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'lose') {
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    let currentBet = 1;
    let selectedMinesCount = 5;

    function updateBalanceUI() {
      document.getElementById('balance').innerText = balance.toFixed(2);
    }

    function setBet(amount, btn) {
      playSound('click');
      currentBet = amount;
      document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function selectMinesCount(count, btn) {
      if(minesState.active) return;
      playSound('click');
      selectedMinesCount = count;
      document.querySelectorAll('.mine-count-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function switchTab(tab) {
      playSound('click');
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      
      const targetBtn = document.querySelector(`[onclick="switchTab('${tab}')"]`);
      if(targetBtn) targetBtn.classList.add('active');
      
      document.getElementById(tab + 'View').classList.add('active');
      document.getElementById('betControlSection').style.display = (tab === 'deposit') ? 'none' : 'block';
    }

    function checkBalanceOrRedirect() {
      if (balance < currentBet) {
        playSound('lose');
        alert('Balansınız kifayət etmir! Lütfən balansı artırın.');
        switchTab('deposit');
        return false;
      }
      return true;
    }

    // --- SLOT OYUNU ---
    const fruitItems = ['🍎', '🍌', '🍇', '🍓', '🍉', '🍍'];
    function playSlots() {
      if (!checkBalanceOrRedirect()) return;

      balance -= currentBet;
      saveBalanceToDB(balance);
      playSound('click');

      const spinBtn = document.getElementById('spinBtn');
      spinBtn.disabled = true;
      document.getElementById('slotsStatus').innerText = 'Fırlanır...';

      let count = 0;
      const timer = setInterval(() => {
        let r1, r2, r3, r4;
        const winChance = Math.random();
        
        if (count > 12) {
          clearInterval(timer);
          spinBtn.disabled = false;

          if (winChance <= 0.01) {
            const sym = fruitItems[Math.floor(Math.random() * fruitItems.length)];
            r1 = r2 = r3 = r4 = sym;
            const win = currentBet * 25;
            balance += win;
            playSound('win');
            document.getElementById('slotsStatus').innerText = `BÖYÜK CEKPOT! +${win.toFixed(2)} AZN! 🎉`;
          } else {
            r1 = fruitItems[Math.floor(Math.random() * fruitItems.length)];
            r2 = fruitItems[Math.floor(Math.random() * fruitItems.length)];
            r3 = fruitItems[Math.floor(Math.random() * fruitItems.length)];
            r4 = fruitItems[Math.floor(Math.random() * fruitItems.length)];
            if (r1 === r2 && r2 === r3 && r3 === r4) {
              r4 = (r1 === '🍎') ? '🍌' : '🍎';
            }
            playSound('lose');
            document.getElementById('slotsStatus').innerText = 'Şansınızı bir daha sınayın!';
          }

          document.getElementById('slot1').innerText = r1;
          document.getElementById('slot2').innerText = r2;
          document.getElementById('slot3').innerText = r3;
          document.getElementById('slot4').innerText = r4;
          saveBalanceToDB(balance);
        } else {
          document.getElementById('slot1').innerText = fruitItems[Math.floor(Math.random() * fruitItems.length)];
          document.getElementById('slot2').innerText = fruitItems[Math.floor(Math.random() * fruitItems.length)];
          document.getElementById('slot3').innerText = fruitItems[Math.floor(Math.random() * fruitItems.length)];
          document.getElementById('slot4').innerText = fruitItems[Math.floor(Math.random() * fruitItems.length)];
          count++;
        }
      }, 80);
    }

    // --- MİNA OYUNU ---
    let minesState = { active: false, bombs: [], openedCount: 0, multiplier: 1.0 };
    
    function initMinesGrid() {
      const grid = document.getElementById('minesGrid');
      grid.innerHTML = '';
      for (let i = 0; i < 25; i++) {
        const card = document.createElement('div');
        card.className = 'mine-card';
        card.onclick = () => revealMine(i, card);
        grid.appendChild(card);
      }
    }
    initMinesGrid();

    function startMines() {
      const btn = document.getElementById('minesBtn');
      if (minesState.active) {
        const win = currentBet * minesState.multiplier;
        balance += win;
        saveBalanceToDB(balance);
        playSound('win');
        document.getElementById('minesStatus').innerText = `Nağdlaşdırıldı: +${win.toFixed(2)} AZN`;
        endMines();
        return;
      }

      if (!checkBalanceOrRedirect()) return;

      balance -= currentBet;
      saveBalanceToDB(balance);
      playSound('click');

      minesState = { active: true, bombs: [], openedCount: 0, multiplier: 1.0 };
      
      while(minesState.bombs.length < selectedMinesCount) {
        let r = Math.floor(Math.random() * 25);
        if(!minesState.bombs.includes(r)) minesState.bombs.push(r);
      }

      initMinesGrid();
      document.getElementById('minesConfigBox').style.pointerEvents = 'none';
      btn.innerText = `NAĞDLAŞDIR (${currentBet.toFixed(2)} AZN)`;
      document.getElementById('minesStatus').innerText = `${selectedMinesCount} Mina Aktivdir. Təmiz xanaları tapın!`;
    }

    function revealMine(index, card) {
      if(!minesState.active || card.classList.contains('revealed')) return;

      card.classList.add('revealed');
      if (minesState.bombs.includes(index)) {
        card.innerText = '💣';
        playSound('lose');
        document.getElementById('minesStatus').innerText = 'Mina partladı! Uduzdunuz.';
        endMines();
      } else {
        card.innerText = '💎';
        playSound('click');
        minesState.openedCount++;
        
        const stepMultiplier = 1 + (selectedMinesCount * 0.12);
        minesState.multiplier *= stepMultiplier;

        const currentWin = currentBet * minesState.multiplier;
        document.getElementById('minesBtn').innerText = `NAĞDLAŞDIR (${currentWin.toFixed(2)} AZN - x${minesState.multiplier.toFixed(2)})`;
      }
    }

    function endMines() {
      minesState.active = false;
      document.getElementById('minesConfigBox').style.pointerEvents = 'auto';
      document.getElementById('minesBtn').innerText = 'YENİDƏN BAŞLA';
    }

    // --- POZ QAZAN ---
    let scratchItems = [];
    let revealedScratch = 0;

    function startScratch() {
      if (!checkBalanceOrRedirect()) return;

      balance -= currentBet;
      saveBalanceToDB(balance);
      playSound('click');

      scratchItems = [];
      revealedScratch = 0;

      const isWin = Math.random() <= 0.01;

      if (isWin) {
        const winSym = fruitItems[Math.floor(Math.random() * fruitItems.length)];
        scratchItems = [winSym, winSym, winSym, '🍎', '🍌', '🍇', '🍓', '🍉', '🍍'];
      } else {
        scratchItems = ['🍎', '🍎', '🍌', '🍌', '🍇', '🍇', '🍓', '🍓', '🍉'];
      }

      scratchItems.sort(() => Math.random() - 0.5);

      const grid = document.getElementById('scratchGrid');
      grid.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const card = document.createElement('div');
        card.className = 'scratch-card';
        card.innerText = '❓';
        card.onclick = () => scratchCard(i, card);
        grid.appendChild(card);
      }

      document.getElementById('scratchStatus').innerText = 'Xanaları pozun (3 eyni meyvə = uduş)';
    }
    startScratch();

    function scratchCard(index, card) {
      if (card.classList.contains('revealed')) return;

      card.classList.add('revealed');
      card.innerText = scratchItems[index];
      playSound('click');
      revealedScratch++;

      if (revealedScratch === 9) {
        const counts = {};
        scratchItems.forEach(item => counts[item] = (counts[item] || 0) + 1);
        let won = false;

        for (let item in counts) {
          if (counts[item] >= 3) { won = true; break; }
        }

        if (won) {
          const win = currentBet * 5;
          balance += win;
          saveBalanceToDB(balance);
          playSound('win');
          document.getElementById('scratchStatus').innerText = `3 EYNİ MEYVƏ! +${win.toFixed(2)} AZN! 🎉`;
        } else {
          playSound('lose');
          document.getElementById('scratchStatus').innerText = 'Uduş olmadı, bir daha sınayın.';
        }
      }
    }

    function copyCard() {
      const cardNum = document.getElementById('myCardNum').innerText.replace(/\s+/g, '');
      navigator.clipboard.writeText(cardNum);
      alert('Kart nömrəsi kopyalandı!');
    }

    // TELEGRAMA DÜYMƏLİ BİLDİRİŞ GÖNDƏRMƏK
    function submitDepositRequest() {
      if (!userId) {
        alert('Xəta! Oyunu birbaşa Telegram tətbiqi daxilindən açın.');
        return;
      }

      const amount = parseFloat(document.getElementById('payAmountInput').value);
      if (isNaN(amount) || amount < 1) {
        alert('Düzgün məbləğ daxil edin!');
        return;
      }

      const username = user?.username ? `@${user.username}` : (user?.first_name || 'İstifadəçi');

      const messageText = `💳 <b>YENİ DEPOZİT SORĞUSU</b>\n\n👤 <b>İstifadəçi:</b> ${username}\n🆔 <b>User ID:</b> <code>${userId}</code>\n💰 <b>Məbləğ:</b> ${amount} AZN`;

      const keyboard = {
        inline_keyboard: [
          [
            { text: `✅ Təsdiqlə (+${amount} AZN)`, callback_data: `approve_${userId}_${amount}` },
            { text: `❌ İmtina et`, callback_data: `reject_${userId}` }
          ]
        ]
      };

      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: ADMIN_CHAT_ID,
          text: messageText,
          parse_mode: 'HTML',
          reply_markup: keyboard
        })
      })
      .then(res => res.json())
      .then(data => {
        if(data.ok) {
          document.getElementById('depStatus').innerText = `Sorğu adminə göndərildi! Pulu köçürdünüzsə, az sonra balansınız artırılacaq.`;
          playSound('win');
        } else {
          alert('Xəta! Admin (7723256649) Telegram-da bota daxil olub /start düyməsini basmalıdır!');
        }
      });
    }
  </script>
