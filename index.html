<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SUN KAZINO - Official Platform</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --bg-dark: #05020a;
      --card-bg: #0d071b;
      --accent-gold: #ffd700;
      --gold-gradient: linear-gradient(135deg, #ffd700 0%, #b8860b 100%);
      --accent-green: #00ff66;
      --accent-blue: #00f0ff;
      --border-purple: #231145;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; user-select: none; }
    body { background: var(--bg-dark); color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 20px; overflow-x: hidden; }

    /* HEADER & CASHIER BAR */
    .top-header { width: 100%; max-width: 440px; background: #0a0414; padding: 12px 15px; border-bottom: 2px solid var(--border-purple); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
    .brand-logo { font-size: 20px; font-weight: 900; color: var(--accent-gold); text-shadow: 0 0 10px rgba(255,215,0,0.4); letter-spacing: 1px; }
    
    .cashier-box { display: flex; align-items: center; gap: 8px; }
    .balance-badge { background: #15092e; border: 1px solid var(--border-purple); padding: 6px 12px; border-radius: 20px; text-align: right; }
    .balance-title { font-size: 9px; color: #8c7ab3; font-weight: bold; }
    .balance-val { font-size: 14px; font-weight: 900; color: var(--accent-gold); }

    .deposit-btn { background: var(--gold-gradient); color: #000; font-weight: 900; font-size: 12px; padding: 8px 14px; border-radius: 20px; border: none; cursor: pointer; box-shadow: 0 0 10px rgba(255, 215, 0, 0.4); text-transform: uppercase; text-decoration: none; display: inline-block; }
    .deposit-btn:active { transform: scale(0.95); }

    /* NAVIGATION TABS */
    .nav-tabs { width: 100%; max-width: 440px; display: flex; background: #0c051a; border-bottom: 1px solid var(--border-purple); margin-bottom: 10px; }
    .tab-btn { flex: 1; padding: 12px; text-align: center; font-size: 13px; font-weight: 800; color: #72629b; border: none; background: transparent; cursor: pointer; border-bottom: 3px solid transparent; transition: 0.3s; }
    .tab-btn.active { color: #fff; border-bottom-color: var(--accent-gold); background: rgba(255,215,0,0.05); }

    /* CONTAINER FOR GAMES */
    .game-container { width: 100%; max-width: 440px; padding: 0 10px; }
    .game-view { display: none; }
    .game-view.active { display: block; }

    /* GAME 1: QIZIL 40 SLOT */
    .jackpot-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 10px; }
    .jp-box { background: #0d071b; border: 1px solid var(--border-purple); border-radius: 8px; padding: 6px; text-align: center; }
    .jp-title { font-size: 10px; font-weight: 900; }
    .jp-val { font-size: 14px; font-weight: 800; color: #fff; }

    .slot-frame { background: #080312; border: 2px solid var(--border-purple); border-radius: 12px; padding: 6px; box-shadow: inset 0 0 15px #000; }
    .slot-grid-5x4 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
    .slot-cell { aspect-ratio: 0.85; background: radial-gradient(circle, #1a0f3a 0%, #080312 100%); border: 1px solid #281854; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 24px; text-shadow: 0 2px 4px #000; }

    /* GAME 2: QIZIL 100 E-POZ */
    .scratch-card-box { background: #0c051a; border: 2px solid #2d165c; border-radius: 16px; padding: 15px; }
    .grid-3x3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .scratch-cell { aspect-ratio: 1; background: #170a36; border: 2px solid #3d1c80; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; color: var(--accent-gold); position: relative; cursor: pointer; overflow: hidden; }
    .scratch-cover { position: absolute; top:0; left:0; width:100%; height:100%; background: var(--gold-gradient); display: flex; align-items: center; justify-content: center; color: #000; font-size: 22px; font-weight: 900; transition: 0.3s; }
    .scratch-cell.revealed .scratch-cover { opacity: 0; pointer-events: none; transform: scale(0.8); }
    .scratch-cell.winner { border-color: var(--accent-green); background: #003b15; box-shadow: 0 0 10px var(--accent-green); }

    /* GENERAL CONTROLS */
    .controls-panel { margin-top: 12px; background: #0a0414; border: 1px solid var(--border-purple); border-radius: 12px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
    .action-main-btn { background: var(--gold-gradient); border: none; border-radius: 30px; color: #000; font-size: 16px; font-weight: 900; padding: 12px 30px; cursor: pointer; box-shadow: 0 0 15px rgba(255,215,0,0.5); text-transform: uppercase; }
    .action-main-btn:active { transform: scale(0.95); }
    .action-main-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* TELEGRAM DEPOSIT BANNER FOOTER */
    .bot-deposit-card { width: 100%; max-width: 440px; margin-top: 15px; background: linear-gradient(180deg, #160a33, #090317); border: 1.5px dashed var(--accent-blue); border-radius: 12px; padding: 12px; text-align: center; }
    .bot-deposit-title { font-size: 13px; font-weight: bold; color: var(--accent-blue); margin-bottom: 4px; }
    .bot-deposit-sub { font-size: 11px; color: #a192c4; margin-bottom: 10px; }
  </style>
</head>
<body>

  <!-- TOP HEADER / BALANCE BAR -->
  <div class="top-header">
    <div class="brand-logo">SUN KAZİNO</div>
    <div class="cashier-box">
      <div class="balance-badge">
        <div class="balance-title">BALANS</div>
        <div class="balance-val" id="globalBalance">0.00 AZN</div>
      </div>
      <!-- BOTA YÖNLƏNDİRƏN DEPOZİT DÜYMƏSİ -->
      <a href="https://t.me/SizinCasinoDepozitBot" target="_blank" class="deposit-btn">+ DEPOZİT</a>
    </div>
  </div>

  <!-- CATEGORY TABS -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('slotView', this)">🎰 QIZIL 40 (SLOT)</button>
    <button class="tab-btn" onclick="switchTab('scratchView', this)">🎫 QIZIL 100 (E-POZ)</button>
  </div>

  <div class="game-container">
    
    <!-- VIEW 1: QIZIL 40 SLOT GAME -->
    <div id="slotView" class="game-view active">
      <div class="jackpot-grid">
        <div class="jp-box" style="border-color:#ff2a2a;"><div class="jp-title" style="color:#ff2a2a">MEQA</div><div class="jp-val" id="jpMeqa">1,442,654.92</div></div>
        <div class="jp-box" style="border-color:#00ff44;"><div class="jp-title" style="color:#00ff44">BÖYÜK</div><div class="jp-val">24,500.00</div></div>
      </div>

      <div class="slot-frame">
        <div class="slot-grid-5x4" id="slotGrid">
          <!-- 20 Slot cells -->
        </div>
      </div>

      <div class="controls-panel">
        <div>
          <div style="font-size:10px; color:#7866a0; font-weight:bold;">MƏRC MƏBLƏĞİ</div>
          <select id="slotBetSelect" style="background:#180b38; color:#fff; border:1px solid #3b1f80; padding:5px; border-radius:6px; font-weight:bold;">
            <option value="0.20">0.20 AZN</option>
            <option value="0.50">0.50 AZN</option>
            <option value="1.00" selected>1.00 AZN</option>
            <option value="2.00">2.00 AZN</option>
            <option value="5.00">5.00 AZN</option>
          </select>
        </div>
        <button class="action-main-btn" id="slotSpinBtn" onclick="spinSlot()">FIRLAT ↻</button>
      </div>
    </div>

    <!-- VIEW 2: QIZIL 100 SCRATCH GAME -->
    <div id="scratchView" class="game-view">
      <div class="scratch-card-box">
        <div style="text-align:center; font-size:14px; font-weight:900; color:var(--accent-gold); margin-bottom:10px;">
          EYNİ 3 MƏBLƏĞİ TAP VƏ QAZAN!
        </div>
        <div class="grid-3x3" id="scratchGrid">
          <!-- 9 Scratch cells -->
        </div>
      </div>

      <div class="controls-panel">
        <div>
          <div style="font-size:10px; color:#7866a0; font-weight:bold;">BİLET QİYMƏTİ</div>
          <div style="font-size:15px; font-weight:900; color:#fff;">1.00 AZN</div>
        </div>
        <button class="action-main-btn" id="buyScratchBtn" onclick="buyScratchCard()">BİLET AL 🎫</button>
      </div>
    </div>

    <!-- TELEGRAM BOT DEPOSIT & WITHDRAWAL NOTICE -->
    <div class="bot-deposit-card">
      <div class="bot-deposit-title">🤖 7/24 AVTOMATİK DEPOZİT VƏ ÇIXARIŞ</div>
      <div class="bot-deposit-sub">Balansınızı artırmaq və ya uduşu kartınıza çəkmək üçün rəsmi Telegram bota müraciət edin.</div>
      <a href="https://t.me/SizinCasinoDepozitBot" target="_blank" class="deposit-btn" style="background:#00f0ff; width:100%;">BOTA KEÇİD ET (@SizinCasinoBot)</a>
    </div>

  </div>

  <script>
    // Telegram WebApp Setup
    const tg = window.Telegram?.WebApp;
    if(tg) { tg.expand(); tg.ready(); }

    // Firebase İnteqrasiyası
    const firebaseConfig = { databaseURL: "https://sunkazino-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const userId = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : 'demo_user';

    let balance = 100.00;
    let isSpinning = false;

    // Firebase-dən Balans Dinləmə
    db.ref(`users/${userId}/balance`).on('value', (snapshot) => {
      const val = snapshot.val();
      if (val !== null && val !== undefined) {
        balance = parseFloat(val);
      } else {
        db.ref(`users/${userId}/balance`).set(100.00); // İlk istifadəçi üçün demo balans
      }
      updateBalanceUI();
    });

    function saveBalance(newBal) {
      db.ref(`users/${userId}/balance`).set(newBal);
    }

    function updateBalanceUI() {
      document.getElementById('globalBalance').innerText = balance.toFixed(2) + " AZN";
    }

    // TAB SWITCHER
    function switchTab(viewId, btn) {
      document.querySelectorAll('.game-view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      btn.classList.add('active');
    }

    /* --- GAME 1: QIZIL 40 SLOT LOGIC --- */
    const slotSymbols = ['🍒', '🍊', '🍋', '🍇', '🍉', '⭐', '7️⃣', '🌟'];
    const slotGridEl = document.getElementById('slotGrid');

    function initSlotGrid() {
      slotGridEl.innerHTML = '';
      for(let i=0; i<20; i++) {
        const cell = document.createElement('div');
        cell.className = 'slot-cell';
        cell.id = `slot_${i}`;
        cell.innerText = slotSymbols[Math.floor(Math.random() * (slotSymbols.length - 1))];
        slotGridEl.appendChild(cell);
      }
    }
    initSlotGrid();

    function spinSlot() {
      if(isSpinning) return;
      const bet = parseFloat(document.getElementById('slotBetSelect').value);
      
      if(balance < bet) {
        alert("Balansınız kifayət etmir! Lütfən bota yazaraq depozit edin.");
        return;
      }

      balance -= bet;
      saveBalance(balance);
      isSpinning = true;

      let count = 0;
      const interval = setInterval(() => {
        for(let i=0; i<20; i++) {
          document.getElementById(`slot_${i}`).innerText = slotSymbols[Math.floor(Math.random() * slotSymbols.length)];
        }
        count++;
        if(count > 10) {
          clearInterval(interval);
          isSpinning = false;
          
          // %30 Şansla uduş
          if(Math.random() < 0.30) {
            const win = bet * (Math.floor(Math.random() * 4) + 2);
            balance += win;
            saveBalance(balance);
            alert(`TƏBRİKLƏR! Siz ${win.toFixed(2)} AZN qazandınız!`);
          }
        }
      }, 70);
    }

    /* --- GAME 2: QIZIL 100 E-POZ LOGIC --- */
    const scratchGridEl = document.getElementById('scratchGrid');
    let scratchValues = [];
    let revealedCells = 0;
    let scratchActive = false;

    function initEmptyScratch() {
      scratchGridEl.innerHTML = '';
      for(let i=0; i<9; i++) {
        const cell = document.createElement('div');
        cell.className = 'scratch-cell';
        cell.innerHTML = `<span>?</span><div class="scratch-cover">👑</div>`;
        scratchGridEl.appendChild(cell);
      }
    }
    initEmptyScratch();

    function buyScratchCard() {
      if(balance < 1.00) {
        alert("Balansınız kifayət etmir! Lütfən bota yazaraq depozit edin.");
        return;
      }

      balance -= 1.00;
      saveBalance(balance);

      scratchActive = true;
      revealedCells = 0;
      
      // Məbləğlərin generasiyası
      const possible = [0.5, 1.0, 2.0, 5.0, 10.0, 50.0];
      const isWin = Math.random() < 0.35;
      
      if(isWin) {
        const winVal = possible[Math.floor(Math.random() * 3)];
        scratchValues = [winVal, winVal, winVal];
        while(scratchValues.length < 9) scratchValues.push(possible[Math.floor(Math.random() * possible.length)]);
      } else {
        scratchValues = [0.5, 1.0, 2.0, 5.0, 0.5, 1.0, 2.0, 5.0, 10.0];
      }
      scratchValues.sort(() => Math.random() - 0.5);

      // Render
      scratchGridEl.innerHTML = '';
      scratchValues.forEach((val, idx) => {
        const cell = document.createElement('div');
        cell.className = 'scratch-cell';
        cell.innerHTML = `<span>${val.toFixed(2)} ₼</span><div class="scratch-cover">👑</div>`;
        cell.onclick = () => {
          if(!scratchActive || cell.classList.contains('revealed')) return;
          cell.classList.add('revealed');
          revealedCells++;
          if(revealedCells === 9) checkScratchWin();
        };
        scratchGridEl.appendChild(cell);
      });
    }

    function checkScratchWin() {
      scratchActive = false;
      const counts = {};
      let winAmt = 0;
      scratchValues.forEach(v => {
        counts[v] = (counts[v] || 0) + 1;
        if(counts[v] === 3) winAmt = v;
      });

      if(winAmt > 0) {
        balance += winAmt;
        saveBalance(balance);
        alert(`TƏBRİKLƏR! Eyni 3 məbləğ tapıldı: +${winAmt.toFixed(2)} AZN!`);
      }
    }
  </script>
</body>
</html>
